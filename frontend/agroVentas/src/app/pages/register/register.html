<main class="acceso">
  <div class="foto">
    <img src="/img/piña.jpg" alt="Piñas frescas recién cosechadas" />
  </div>

  <div class="panel">
    <div class="contenido">
      <img src="/img/logo.png" alt="AgroVentas" class="logo" />

      <h1>Crear cuenta</h1>
      <p class="contexto">Regístrate para hacer tus pedidos de piña.</p>

      <form #form="ngForm" (ngSubmit)="registrar()">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            [(ngModel)]="nombre"
            autocomplete="name"
            maxlength="100"
            required
          />
        </div>

        <div class="campo">
          <label for="celular">Número de celular</label>
          <input
            id="celular"
            name="celular"
            type="tel"
            [(ngModel)]="celular"
            placeholder="Ej. 3001234567"
            autocomplete="tel-national"
            inputmode="numeric"
            maxlength="10"
            pattern="[0-9]{10}"
            required
          />
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            required
            email
          />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="con-boton">
            <input
              id="password"
              [type]="mostrarPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              minlength="6"
              required
            />
            <button
              class="ojo"
              type="button"
              (click)="alternarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                @if (!mostrarPassword()) {
                  <path d="M4 4 20 20"></path>
                }
              </svg>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <div class="con-boton">
            <input
              id="confirmarPassword"
              [type]="mostrarConfirmarPassword() ? 'text' : 'password'"
              name="confirmarPassword"
              [(ngModel)]="confirmarPassword"
              autocomplete="new-password"
              required
            />
            <button
              class="ojo"
              type="button"
              (click)="alternarConfirmarPassword()"
              [attr.aria-label]="mostrarConfirmarPassword() ? 'Ocultar confirmación' : 'Mostrar confirmación'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                @if (!mostrarConfirmarPassword()) {
                  <path d="M4 4 20 20"></path>
                }
              </svg>
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="mensaje-error" role="alert">{{ error() }}</p>
        }

        <button class="principal" type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Creando cuenta…' : 'Crear cuenta' }}
        </button>

        <p class="pie">¿Ya tienes una cuenta? <a routerLink="/login">Iniciar sesión</a></p>
      </form>
    </div>
  </div>
</main>
