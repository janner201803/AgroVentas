<main class="acceso">
  <div class="foto">
    <img src="/img/piña.jpg" alt="Piñas frescas recién cosechadas" />
  </div>

  <div class="panel">
    <div class="contenido">
      <img src="/img/logo.png" alt="AgroVentas" class="logo" />

      <h1>Iniciar sesión</h1>

      <form (ngSubmit)="iniciarSesion()">
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="tucorreo@ejemplo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="con-boton">
            <input
              id="password"
              [type]="mostrarPassword() ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              autocomplete="current-password"
              required
            />
            <button
              class="ojo"
              type="button"
              (click)="alternarPassword()"
              [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
                @if (!mostrarPassword()) {
                  <path d="M4 4 20 20"></path>
                }
              </svg>
            </button>
          </div>
        </div>

        @if (error()) {
          <p class="mensaje-error" role="alert">{{ error() }}</p>
        }

        <button class="principal" type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Iniciando sesión…' : 'Iniciar sesión' }}
        </button>

        <p class="enlace"><a routerLink="/recuperar-contrasena">¿Olvidaste tu contraseña?</a></p>

        <div class="separador" aria-hidden="true">o</div>

        <button class="contorno" type="button" (click)="iniciarConGoogle()">
          <svg class="icono-google" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/>
            <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
          </svg>
          Continuar con Google
        </button>

        <p class="pie">¿No tienes una cuenta? <a routerLink="/register">Crear cuenta</a></p>
      </form>
    </div>
  </div>
</main>
