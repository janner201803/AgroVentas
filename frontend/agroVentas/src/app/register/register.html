<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/login" class="brand">
      <span class="brand-icon">🍍</span>
      <span>agro<span class="brand-light">Ventas</span></span>
    </a>

    <div class="heading">
      <span class="eyebrow">ÚNETE A AGROVENTAS</span>
      <h1>Crea tu cuenta</h1>
      <p>Regístrate para comenzar a disfrutar de nuestros productos.</p>
    </div>

    <form #form="ngForm" (ngSubmit)="registrar()">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
          required
          email
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
          required
          minlength="6"
        />
      </div>

      <div class="field">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          type="password"
          [(ngModel)]="confirmarPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="error" *ngIf="error" role="alert">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="form.invalid || cargando"
      >
        {{ cargando ? 'Creando cuenta...' : 'Registrarme →' }}
      </button>
    </form>

    <p class="login-text">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>

    <p class="bottom-text">
      🍃 Del campo a tu negocio.
    </p>
  </div>
</div>
